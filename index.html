<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6ef3">
<title>مراسلة جيرة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1b6ef3;--blue-d:#1455c4;--ink:#12203a;--mute:#6b7a96;--paper:#f3f7ff;--card:#fff;--line:#dfe7f5;--mine:#1b6ef3;--mine-t:#fff;--theirs:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e8eefc;--mute:#8fa0c2;--paper:#0d1424;--card:#141d33;--line:#243251;--theirs:#1b2744}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* auth */
#auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.box h1{font-size:28px;color:var(--blue);margin-bottom:4px}
.box p{color:var(--mute);margin-bottom:20px}
.box input{width:100%;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.btn{width:100%;padding:12px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700}
.btn:hover{background:var(--blue-d)}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.link{color:var(--blue);margin-top:14px;display:block;text-align:center;width:100%}
.err{color:#d93025;min-height:22px;font-size:14px;margin-bottom:6px}

/* app */
#app{height:100dvh;display:grid;grid-template-columns:340px 1fr}
.side{background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--blue);color:#fff}
.top b{font-size:20px}
.top button{color:#fff;font-size:14px;opacity:.9}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.list{overflow-y:auto;flex:1}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;text-align:start;border-bottom:1px solid var(--line)}
.row:hover,.row.on{background:var(--paper)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.row .n{font-weight:500}.row .s{color:var(--mute);font-size:13px}
.empty{padding:32px 20px;color:var(--mute);text-align:center}

.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.head{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.back{display:none;font-size:22px;color:var(--blue);padding:4px 8px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,460px);padding:8px 12px;border-radius:16px;background:var(--theirs);border:1px solid var(--line);align-self:flex-end;border-end-end-radius:4px;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{align-self:flex-start;background:var(--mine);color:var(--mine-t);border-color:var(--mine);border-end-end-radius:16px;border-end-start-radius:4px}
.m time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.none{margin:auto;color:var(--mute);text-align:center}
.comp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.comp input{flex:1;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.comp button{padding:0 20px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700}
.comp button:disabled{opacity:.5}
.ph{display:grid;place-items:center;color:var(--mute);height:100%}

@media (max-width:760px){
  #app{grid-template-columns:1fr}
  .chat{display:none}
  #app.in .side{display:none}
  #app.in .chat{display:flex}
  .back{display:block}
}
@media (prefers-reduced-motion:no-preference){.m{animation:pop .15s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.4}}}
</style>
</head>
<body>

<!-- Auth -->
<main id="auth">
  <div class="box">
    <h1>جيرة</h1>
    <p id="authSub">سجّل دخولك عشان تكلّم جيرانك</p>
    <input id="name" placeholder="الاسم" autocomplete="name" hidden>
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="pass" type="password" placeholder="كلمة السر" autocomplete="current-password">
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <button class="btn" id="go">دخول</button>
    <button class="btn alt" id="google">الدخول بحساب جوجل</button>
    <button class="link" id="swap">معندكش حساب؟ سجّل حساب جديد</button>
  </div>
</main>

<!-- App -->
<div id="app" hidden>
  <aside class="side">
    <div class="top"><b>الرسائل</b><button id="out">خروج</button></div>
    <div class="search"><input id="q" type="search" placeholder="دوّر على جار"></div>
    <div class="list" id="list"></div>
  </aside>
  <section class="chat">
    <div class="ph" id="ph">اختار جار عشان تبدأ المحادثة</div>
    <div id="pane" hidden style="display:flex;flex-direction:column;min-height:0;height:100%">
      <div class="head">
        <button class="back" id="back" aria-label="رجوع">›</button>
        <div class="av" id="hav"></div><b id="hn"></b>
      </div>
      <div class="msgs" id="msgs"></div>
      <form class="comp" id="form">
  <input id="mediaFile" type="file" accept="image/*,video/*" hidden>
  <button type="button" id="mediaBtn">📎</button>
  <input id="txt" placeholder="اكتب رسالة" autocomplete="off">
  <button id="send" type="submit">إرسال</button>
      </form>
      
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ⚠️ الصق هنا إعدادات Firebase بتاعة مشروع جيرة (نفس اللي في كود الموقع)
const firebaseConfig = {
  apiKey: "AIzaSyBlpxyd3OoOh9M74vfjN_4tCbeSxycelA0",
  authDomain: "jeera-fca2a.firebaseapp.com",
  projectId: "jeera-fca2a",
  storageBucket: "jeera-fca2a.firebasestorage.app",
  messagingSenderId: "1093444123156",
  appId: "1:1093444123156:web:e613cdf0b31a46451f8501",
  measurementId: "G-KRRS13ZQK8"
};

const $ = id => document.getElementById(id)
try {
  if (!window.firebase) throw new Error('مكتبات Firebase لم يتم تحميلها.');
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
} catch (e) {
  $('err').textContent = e.message || 'تعذر تشغيل Firebase.';
  throw e;
}

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let me = null, peer = null, users = [], unsubMsgs = null, unsubUsers = null, signup = false;  
let me = null, peer = null, users = [], unsubMsgs = null, unsubUsers = null, signup = false;

const COLORS = ['#1b6ef3','#0f9d8a','#e0702b','#8a4fd6','#d6457a','#3a8f3a'];
const color = s => COLORS[[...s].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
const initial = n => (n||'?').trim().charAt(0);
function avatar(el,u){el.textContent=initial(u.name);el.style.background=color(u.uid||u.name||'')}

/* ---------- auth ---------- */
const errs = {
  'auth/invalid-credential':'البريد أو كلمة السر غلط',
  'auth/invalid-email':'البريد الإلكتروني مش صحيح',
  'auth/email-already-in-use':'البريد ده متسجل قبل كده',
  'auth/weak-password':'كلمة السر لازم تبقى 6 حروف على الأقل',
  'auth/popup-closed-by-user':'اتقفلت نافذة الدخول'
};
function showErr(e){
  console.error('Firebase Auth error:', e);
  $('err').textContent = (errs[e.code] || 'حصلت مشكلة أثناء تسجيل الدخول') +
    (e.code ? ' (' + e.code + ')' : '');
}
function setMode(s){
  signup = s;
  $('name').hidden = !s;
  $('go').textContent = s ? 'سجّل حساب' : 'دخول';
  $('swap').textContent = s ? 'عندك حساب؟ ادخل' : 'معندكش حساب؟ سجّل حساب جديد';
  $('pass').autocomplete = s ? 'new-password' : 'current-password';
  $('err').textContent = '';
}
$('swap').onclick = () => setMode(!signup);
$('go').type = 'button';
$('go').onclick = async (ev) => {
  if (ev) ev.preventDefault();
  const email = $('email').value.trim();
  const pass = $('pass').value;
  const name = $('name').value.trim();
  $('err').textContent = '';

  if (!email || !pass) {
    $('err').textContent = 'اكتب البريد الإلكتروني وكلمة السر الأول';
    return;
  }
  if (!window.firebase || !auth) {
    $('err').textContent = 'Firebase لم يتم تحميله. افتح الملف مع اتصال إنترنت ومن خلال متصفح يدعم JavaScript.';
    return;
  }

  const oldLabel = $('go').textContent;
  $('go').disabled = true;
  $('go').textContent = 'جاري الدخول...';
  try {
    if (signup) {
      if (!name) {
        $('err').textContent = 'اكتب اسمك';
        return;
      }
      const c = await auth.createUserWithEmailAndPassword(email, pass);
      await c.user.updateProfile({displayName:name});
      await saveUser(c.user, name);
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
  } catch(e) {
    showErr(e);
  } finally {
    $('go').disabled = false;
    $('go').textContent = oldLabel;
  }
};
$('google').onclick = async () => {
  try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()) }catch(e){ showErr(e) }
};
$('out').onclick = () => auth.signOut();

function saveUser(u, name){
  return db.collection('users').doc(u.uid).set({
    uid:u.uid, name:name || u.displayName || (u.email||'').split('@')[0],
    email:u.email||'', lastSeen:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
}

auth.onAuthStateChanged(async u => {
  me = u;
  if(unsubUsers){unsubUsers();unsubUsers=null}
  if(unsubMsgs){unsubMsgs();unsubMsgs=null}
  peer = null;
  $('auth').hidden = !!u;
  $('app').hidden = !u;
  if(!u) return;
  try{ await saveUser(u, u.displayName) }catch(e){}
  unsubUsers = db.collection('users').onSnapshot(s => {
    users = s.docs.map(d => ({uid:d.id, ...d.data()})).filter(x => x.uid !== me.uid);
    users.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
    renderList();
  });
});

/* ---------- list ---------- */
function renderList(){
  const q = $('q').value.trim().toLowerCase();
  const l = $('list'); l.textContent = '';
  const f = users.filter(u => (u.name||'').toLowerCase().includes(q));
  if(!f.length){
    const d = document.createElement('div'); d.className='empty';
    d.textContent = q ? 'مفيش حد بالاسم ده' : 'لسه مفيش جيران مسجلين. ادعو حد يسجل وهيظهر هنا.';
    l.append(d); return;
  }
  f.forEach(u => {
    const b = document.createElement('button'); b.className = 'row' + (peer && peer.uid===u.uid ? ' on' : '');
    const a = document.createElement('div'); a.className='av'; avatar(a,u);
    const t = document.createElement('div');
    const n = document.createElement('div'); n.className='n'; n.textContent = u.name || 'جار';
    t.append(n); b.append(a,t);
    b.onclick = () => openChat(u);
    l.append(b);
  });
}
$('q').oninput = renderList;

/* ---------- chat ---------- */
const chatId = (a,b) => [a,b].sort().join('_');
function openChat(u){
  peer = u;
  $('ph').hidden = true; $('pane').hidden = false;
  $('app').classList.add('in');
  $('hn').textContent = u.name || 'جار'; avatar($('hav'),u);
  renderList();
  if(unsubMsgs) unsubMsgs();
  const box = $('msgs'); box.textContent = '';
  unsubMsgs = db.collection('chats').doc(chatId(me.uid,u.uid)).collection('messages')
    .orderBy('createdAt').limitToLast(200).onSnapshot(s => {
      box.textContent = '';
      if(s.empty){
        const d = document.createElement('div'); d.className='none'; d.textContent='ابعت أول رسالة لـ ' + (u.name||'جارك'); box.append(d); return;
      }
      s.docs.forEach(d => {
        const m = d.data();
        const el = document.createElement('div'); el.className = 'm' + (m.from===me.uid ? ' me' : '');
        if (m.type === 'image' && m.url) {
  const img = document.createElement('img');
  img.src = m.url;
  img.alt = 'صورة مرسلة';
  img.style.cssText = 'max-width:220px;width:100%;border-radius:12px;display:block';
  el.append(img);
} else if (m.type === 'video' && m.url) {
  const video = document.createElement('video');
  video.src = m.url;
  video.controls = true;
  video.playsInline = true;
  video.style.cssText = 'max-width:240px;width:100%;border-radius:12px';
  el.append(video);
} else {
  el.append(document.createTextNode(m.text || ''));
  }
        const tm = document.createElement('time');
        const dt = m.createdAt ? m.createdAt.toDate() : new Date();
        tm.textContent = dt.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'});
        el.append(tm); box.append(el);
      });
      box.scrollTop = box.scrollHeight;
    }, e => { box.textContent=''; const d=document.createElement('div'); d.className='none'; d.textContent='مش قادر أحمّل الرسائل. راجع قواعد Firestore.'; box.append(d) });
  $('txt').focus();
}
$('back').onclick = () => { $('app').classList.remove('in') };
 $('mediaBtn').onclick = () => {
  if (!peer) return alert('اختار محادثة الأول');
  $('mediaFile').click();
};

$('mediaFile').onchange = async function() {
  const file = this.files[0];
  if (!file || !peer || !me) return;

  const isImage = file.type.startsWith('image/');
  const isVideo = file.type.startsWith('video/');

  if (!isImage && !isVideo) {
    alert('اختار صورة أو فيديو فقط');
    this.value = '';
    return;
  }

  const maxSize = isImage ? 10 : 50;
  if (file.size > maxSize * 1024 * 1024) {
    alert('الحد الأقصى ' + maxSize + ' ميجابايت');
    this.value = '';
    return;
  }

  const btn = $('mediaBtn');
  btn.disabled = true;
  btn.textContent = '...';

  try {
    const id = chatId(me.uid, peer.uid);
    const path = 'chatMedia/' + id + '/' + Date.now() + '_' +
      file.name.replace(/[^a-zA-Z0-9._-]/g, '_');

    const ref = storage.ref().child(path);
    const result = await ref.put(file);
    const url = await result.ref.getDownloadURL();
    const type = isImage ? 'image' : 'video';
    const ts = firebase.firestore.FieldValue.serverTimestamp();

    await db.collection('chats').doc(id).collection('messages').add({
      from: me.uid,
      text: '',
      type: type,
      url: url,
      fileName: file.name,
      createdAt: ts
    });

    await db.collection('chats').doc(id).set({
      members: [me.uid, peer.uid],
      last: isImage ? '📷 صورة' : '🎥 فيديو',
      updatedAt: ts
    }, {merge: true});

  } catch (e) {
    console.error(e);
    alert('فشل رفع الملف. راجع إعدادات Firebase Storage.');
  } finally {
    btn.disabled = false;
    btn.textContent = '📎';
    this.value = '';
  }
}; 

$('form').onsubmit = async e => {
  e.preventDefault();
  const text = $('txt').value.trim();
  if(!text || !peer) return;
  $('txt').value = '';
  const id = chatId(me.uid, peer.uid), ts = firebase.firestore.FieldValue.serverTimestamp();
  try{
    await db.collection('chats').doc(id).collection('messages').add({from:me.uid, text, createdAt:ts});
    await db.collection('chats').doc(id).set({members:[me.uid,peer.uid], last:text, updatedAt:ts},{merge:true});
  }catch(err){ $('txt').value = text }
};
</script>
</body>
</html>
